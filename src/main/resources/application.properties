# ==========================================
# SPRING CORE & PROJECT LOOM
# ==========================================
spring.application.name=cookiebot-core
# ATIVAÇÃO OBRIGATÓRIA DE VIRTUAL THREADS PARA I/O (JAVA 21+)
spring.threads.virtual.enabled=true

# ==========================================
# DATASOURCE (POSTGRESQL 18)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/cookiebotdb
spring.datasource.username=postgres
spring.datasource.password=cookiebot_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURAÇÃO DE POOL HIKARICP ENXUTO (LIMITES RÍGIDOS)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000

# ==========================================
# JPA & HIBERNATE
# ==========================================
# PROIBIDO: ddl-auto diferente de validate ou none. Flyway é a única fonte de verdade.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# DESATIVADO EM PRODUÇÃO PARA POUPAR I/O DE DISCO
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# REDIS (LETTUCE)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis_secret

# ==========================================
# TELEGRAM WEBHOOK SECURITY
# ==========================================
telegram.webhook.secret=token_secreto_local_para_desenvolvimento

# ==========================================
# AI & WORKERS (LOCAL CONTAINERS)
# ==========================================
cookiebot.llm.url=http://localhost:11434/api/generate
cookiebot.stt.url=http://localhost:8080/inference