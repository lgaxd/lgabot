services:
  # --- BANCO DE DADOS CORE ---
  lgabot-db:
    image: postgres:alpine
    container_name: lgabot-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lgabot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- CACHE CENTRALIZADO (L2) & RATE LIMITING ---
  lgabot-cache:
    image: redis:alpine
    container_name: lgabot-cache
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - lgabot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- OBJECT STORAGE LOCAL (Alternativa ao GCS) ---
  lgabot-storage:
    image: minio/minio:latest
    container_name: lgabot-storage
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web Administrativo
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - lgabot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- MOTOR DE TRADUÇÃO LOCAL ---
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    env_file:
      - .env
    environment:
      - LT_HOST=${LT_HOST}
      - LT_PORT=${LT_PORT}
      - LT_LOAD_ONLY=${LT_LOAD_ONLY} # Otimiza memória inicializando apenas os idiomas do Bot
    networks:
      - lgabot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- MOTOR DE BUSCA ANÔNIMO LOCAL (Imagens/Vídeos) ---
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - lgabot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- API APPLICATION (SPRING BOOT 4.1.0 + JAVA 26) ---
  lgabot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lgabot-api
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_THREADS_VIRTUAL_ENABLED=${SPRING_THREADS_VIRTUAL_ENABLED}
      # Integração Postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://lgabot-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # Integração Redis
      - SPRING_DATA_REDIS_HOST=lgabot-cache
      - SPRING_DATA_REDIS_PORT=6379
      # Integração MinIO (SDK S3)
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      # Integrações de Serviços Internos
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL}
      - SEARXNG_URL=${SEARXNG_URL}
    depends_on:
      lgabot-db:
        condition: service_healthy
      lgabot-cache:
        condition: service_healthy
      lgabot-storage:
        condition: service_healthy
    networks:
      - lgabot-net
    restart: unless-stopped

  # --- PROXY REVERSO E SEGURANÇA GATEWAY ---
  nginx:
    image: nginx:alpine
    container_name: lgabot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - lgabot-api
    networks:
      - lgabot-net
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  lgabot-net:
    driver: bridge
