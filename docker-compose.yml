version: '3.8'

networks:
  cookiebot-net:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: cookiebot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cookiebot_secret
      POSTGRES_DB: cookiebotdb
      # Tuning de shared_buffers para respeitar o teto de 512MB de RAM
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    ports:
      - "5432:5432"
    networks:
      - cookiebot-net
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.4-alpine
    container_name: cookiebot-redis
    command: ["redis-server", "--requirepass", "redis_secret", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    networks:
      - cookiebot-net
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:latest
    container_name: cookiebot-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: cookiebot_minio_secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cookiebot-net
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:alpine
    container_name: cookiebot-nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - cookiebot-net
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  minio_data: